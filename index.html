<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mourão Consultoria</title>

      <!-- Ícones do PWA e Navegador (Favicon) -->
  <link rel="icon" type="image/png" sizes="192x192" href="icone192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icone512.png">
  <link rel="apple-touch-icon" href="icone192.png">
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0b1c30">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Exec Pro">
  
  <!-- Ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    /* RESET E FONTES */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* DESIGN TOKENS */
    :root {
      --primary: #0b1c30;
      --mint: #14B8A6;
      --coral: #EF4444;
      --slate: #64748B;
      --white: #FFFFFF;
      --surface: #f8f9ff;
    }

    body {
      background-color: var(--primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .loginContainer {
      width: 100%;
      max-width: 400px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .loginHeader {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 40px;
    }

    .loginLogo {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background-color: rgba(20, 184, 166, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      border: 1px solid rgba(20, 184, 166, 0.2);
    }

    .loginSubtitle {
      font-size: 12px;
      font-weight: 900;
      color: var(--slate);
      letter-spacing: 3px;
      margin-bottom: 4px;
    }

    .loginTitle {
      font-size: 28px;
      font-weight: 900;
      color: var(--white);
      letter-spacing: -1px;
    }

    .loginTitle span {
      color: var(--mint);
    }

    .loginCard {
      background-color: var(--white);
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
    }

    .loginCardTitle {
      font-size: 16px;
      font-weight: 900;
      color: var(--primary);
      margin-bottom: 20px;
    }

    .loginInputWrapper {
      display: flex;
      align-items: center;
      background-color: #F8FAFC;
      border-radius: 16px;
      border: 1px solid #F1F5F9;
      margin-bottom: 16px;
      padding: 0 16px;
      height: 60px;
      transition: border-color 0.2s;
    }

    .loginInputWrapper.error {
      border-color: var(--coral);
    }

    .loginInputIcon {
      margin-right: 12px;
      color: var(--slate);
    }

    .loginInput {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      color: var(--primary);
      border: none;
      background: transparent;
      outline: none;
      width: 100%;
      height: 100%;
    }

    .loginInput::placeholder {
      color: var(--slate);
      font-weight: 600;
    }

    .loginErrorTxt {
      color: var(--coral);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 10px;
      margin-top: -5px;
      display: none; /* Escondido por padrão */
    }

    .loginBtn {
      background-color: var(--mint);
      height: 60px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
      cursor: pointer;
      border: none;
      width: 100%;
      transition: opacity 0.2s;
    }

    .loginBtn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .loginBtnTxt {
      color: var(--white);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .loginFooter {
      text-align: center;
      color: var(--slate);
      font-size: 10px;
      font-weight: 600;
      margin-top: 30px;
    }

    /* Animação do Loading */
    .spinner {
      display: none;
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="loginContainer">
    <div class="loginHeader">
      <div class="loginLogo">
        <i data-lucide="briefcase" color="#14B8A6" width="40" height="40"></i>
      </div>
      <div class="loginSubtitle">SISTEMA DE GESTÃO</div>
      <div class="loginTitle">EXECUTIVE<span> PRO</span></div>
    </div>

    <form class="loginCard" id="loginForm">
      <div class="loginCardTitle">Acesso Administrativo</div>
      
      <div class="loginInputWrapper" id="emailWrapper">
        <i data-lucide="mail" class="loginInputIcon" width="20" height="20"></i>
        <input 
          type="email" 
          id="email" 
          class="loginInput" 
          placeholder="E-mail corporativo" 
          autocomplete="off"
          required
        >
      </div>

      <div class="loginInputWrapper" id="passwordWrapper">
        <i data-lucide="lock" class="loginInputIcon" width="20" height="20"></i>
        <input 
          type="password" 
          id="password" 
          class="loginInput" 
          placeholder="Senha de acesso" 
          required
        >
      </div>

      <div id="errorTxt" class="loginErrorTxt">Credenciais inválidas. Tente novamente.</div>

      <button type="submit" class="loginBtn" id="submitBtn">
        <span class="loginBtnTxt" id="btnText">ENTRAR NO SISTEMA</span>
        <div class="spinner" id="spinner"></div>
      </button>
    </form>
    
    <div class="loginFooter">Manaus (AMT UTC-4) • Conexão Segura Supabase</div>
  </div>

  <!-- Importa a conexão com o banco que você criou no seu VS Code -->
  <script src="supabase.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Inicializa os ícones do Lucide
      lucide.createIcons();

      const loginForm = document.getElementById('loginForm');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const errorTxt = document.getElementById('errorTxt');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');
      const emailWrapper = document.getElementById('emailWrapper');
      const passwordWrapper = document.getElementById('passwordWrapper');

      // Verifica se já existe uma sessão ativa ao abrir a página
      if (window.supabase) {
        const { data: { session } } = await supabase.auth.getSession();
        if (session) {
          window.location.href = 'inicio.html';
          return;
        }
      }

      function showError(msg) {
        errorTxt.textContent = msg;
        errorTxt.style.display = 'block';
        emailWrapper.classList.add('error');
        passwordWrapper.classList.add('error');
      }

      function hideError() {
        errorTxt.style.display = 'none';
        emailWrapper.classList.remove('error');
        passwordWrapper.classList.remove('error');
      }

      function setLoading(isLoading) {
        if (isLoading) {
          submitBtn.disabled = true;
          btnText.style.display = 'none';
          spinner.style.display = 'block';
        } else {
          submitBtn.disabled = false;
          btnText.style.display = 'block';
          spinner.style.display = 'none';
        }
      }

      // Limpa os erros quando o usuário digita
      emailInput.addEventListener('input', hideError);
      passwordInput.addEventListener('input', hideError);

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          showError('Preencha os campos obrigatórios.');
          return;
        }

        setLoading(true);
        hideError();

        if (window.supabase) {
          const { data, error } = await supabase.auth.signInWithPassword({
            email,
            password,
          });

          if (error) {
            showError('E-mail ou senha incorretos.');
            setLoading(false);
          } else if (data.session) {
            // Login bem-sucedido, redireciona para o sistema
            window.location.href = 'inicio.html';
          }
        } else {
          showError('Erro: Arquivo supabase.js não encontrado ou configurado incorretamente.');
          setLoading(false);
        }
      });
    });

    // Registro do Service Worker (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado com sucesso!', reg))
          .catch(err => console.error('Falha ao registrar Service Worker', err));
      });
    }
  </script>
</body>
</html>
